[package]
name = "verifier"
version = "0.1.0"
edition = "2021"

[dependencies]
alloy = { version = "1.0.9", features = ["sol-types", "signer-local", "signers", "provider-http", "contract", "rpc-types"] }
hex = "0.4.3"
jsonschema = "0.46.5"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10.9"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread"] }
