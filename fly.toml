# Fly.io config for the Latch agent server (Node + the Rust verifier binary).
# `fly launch` will set a unique app name; secrets come from `fly secrets import < .env`.
app = "latch-engine"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1   # keep one always-on so there's no cold start mid-demo

[env]
  PORT = "8080"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
